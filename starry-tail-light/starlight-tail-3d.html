const OA=856;

function rCenterSplit(l,t){const p=P.centerSplit;const prog=(t*p.speed)%2;const f=Math.min(prog,1.2);const ax=Math.abs(l.y)/YA;if(ax>f)return 0;const d=f-ax;if(d>p.tailLen)return 0;let b=p.headBright*.6*(1+Math.cos(Math.PI*d/p.tailLen));if(Math.abs(ax-f)<.06)b*=Math.abs(ax-f)/.06;if(prog<.15)b*=prog/.15;if(prog>1.2)b*=Math.max(0,1-(prog-1.2)*1.5);return Math.max(0,Math.min(1,b))}

function rWave(l,t){const p=P.wave;let b=0;for(let w=0;w<p.count;w++){const ph=w/p.count,cn=((t*p.speed+ph)%1.8),d=Math.abs(l.rn-cn),hw=p.width*.5;if(d<hw){let i=.5*(1+Math.cos(Math.PI*d/hw));if(cn>1)i*=Math.max(0,1-(cn-1)*2.5);b=Math.max(b,i)}}return Math.max(p.base,b)}

function rMeteor(l,t){const p=P.meteor;let b=p.base;for(let m=0;m<p.count;m++){const h1=hash(m*7.31),h2=hash(m*13.17),h3=hash(m*23.89);const ma=(h1-.5)*Math.PI*.5,ms=p.speed*(.6+h2*.8),md=m*.35+h3*.3;const prog=((t-md)*ms*.5)%1.4;if(prog<0||prog>1.2)continue;const pj=l.y*Math.cos(ma)+(l.z-ZM)*Math.sin(ma),pn=(pj+YA)/(2*YA),d=pn-prog;const cp=-l.y*Math.sin(ma)+(l.z-ZM)*Math.cos(ma),cn=Math.abs(cp)/ZH,cf=Math.max(0,1-(cn/p.beam)**2);if(-.18<=d&&d<=.015){let i=Math.exp(-Math.abs(d)/(p.tail*.25));if(d>-.02)i=Math.min(1,i*1.5);i*=cf;if(prog<.05)i*=prog/.05;b=Math.max(b,i)}}return b}

function rSingleMeteor(l,t){const p=P.singleMeteor;const prog=((t*p.speed*.5)%1.4);if(prog<0||prog>1.2)return p.base;const a=.15,pj=l.y*Math.cos(a)+(l.z-ZM)*Math.sin(a),pn=(pj+YA)/(2*YA),d=pn-prog;const cp=-l.y*Math.sin(a)+(l.z-ZM)*Math.cos(a),cn=Math.abs(cp)/ZH,cf=Math.max(0,1-(cn/p.beam)**2);if(d<-p.tail||d>.015)return p.base;let i=Math.exp(-Math.abs(d)/(p.tail*.2));if(d>-.02)i=Math.min(1,i*1.8);i*=cf;if(prog<.05)i*=prog/.05;if(prog>1)i*=Math.max(0,1-(prog-1)*5);return Math.max(0,p.bright*i)}

function rBreath(l,t){const p=P.breath;const phase=(t%p.period)/p.period;let v;if(phase<0.4)v=Math.sin(phase/0.4*Math.PI/2);else v=Math.cos((phase-0.4)/0.6*Math.PI/2);const flicker=.02*Math.sin(t*8.7+l.x*.01);return Math.max(0,p.minB+(p.maxB-p.minB)*v+flicker)}

function rChase(l,t){const p=P.chase;const a=(Math.atan2(l.y,l.z-ZM)+Math.PI)/(2*Math.PI);let b=0;for(let c=0;c<p.count;c++){const pos=(t*p.speed/3+c/p.count)%1;let d=a-pos;if(d<0)d+=1;const tw=p.tail/20;if(d<tw)b=Math.max(b,.5*(1+Math.cos(Math.PI*d/tw)))}return Math.max(p.base,b)}

function rSparkle(l,t){const p=P.sparkle;const h=(l.x*7919+1)%1e4/1e4;if(h>p.density)return p.base;return p.base+(1-p.base)*((Math.sin((h*100+t*p.speed)*2*Math.PI)+1)/2)*.8}

function rLayerWave(l,t){const p=P.layerWave;const Nr=p.rings||3,w=p.width||.28,ph=p.phase||.22,sp=p.speed||.12;const fi=Math.floor(l.rn*Nr);if(fi>=Nr)return p.base;const lo=fi/Nr,hi=(fi+1)/Nr,cn=(l.rn-lo)/(hi-lo);const cur=((t*sp+fi*ph)%(1+ph));let b=0;if(cur>=0&&cur<=1){const d=Math.abs(cn-cur);if(d<w*.5){b=.5*(1+Math.cos(Math.PI*d/(w*.5)));if(cur<.1)b*=cur/.1;if(cur>.9)b*=Math.max(0,(1-cur)/.1)}}if(p.base>0)b=Math.max(p.base,b);return Math.max(0,Math.min(1,b))}

function rWaveSplit(l,t){const p=P.waveSplit;let bWave=0;for(let i=0;i<p.count;i++){const ph=i/p.count,head=((t*p.speed+ph)%1.6),d=Math.abs(l.rn-head),hw=p.width*.5;if(d<hw){const g=1-d/hw,bri=g*g*(3-2*g)*(head<.15?head/.15:1)*(head>1.4?Math.max(0,(1.6-head)/.2):1);bWave=Math.max(bWave,bri)}}let bSplit=0;const ax=Math.abs(l.y)/YA,phase=(t*p.splitSpeed)%1.5,front=Math.min(phase,1);if(ax<=front){const dist=front-ax;if(dist<p.tailLen){const g2=1-dist/p.tailLen,bri2=g2*g2*(3-2*g2)*.7*(phase<.1?phase/.1:1)*(phase>1?Math.max(0,(1.5-phase)/.5):1);bSplit=bri2}}return Math.max(p.base,Math.max(bWave,bSplit))}

function rMarquee(l,t){const p=P.marquee;const ry=(l.y)/YA,rz=(l.z-ZM)/ZH,r=Math.sqrt(ry*ry+rz*rz);const yNorm=(l.z-ZM+ZH)/(2*ZH);const isInner=r<.55,isOuter=r>=.4;const cyc=1/p.speed,phase=(t/cyc)%1;let val=p.base;if(phase<.5){const headY=phase*2,d=Math.abs(yNorm-headY);if(isInner&&d<p.tailLen){const g=1-d/p.tailLen;val=Math.max(val,g*g*(3-2*g)*.95)}}else{const headY=1-(phase-.5)*2,d=Math.abs(yNorm-headY);if(isOuter&&d<p.tailV){const g=1-d/p.tailV;val=Math.max(val,g*g*(3-2*g)*.85)}}return val}

const RR={centerSplit:rCenterSplit,wave:rWave,meteor:rMeteor,singleMeteor:rSingleMeteor,breath:rBreath,chase:rChase,sparkle:rSparkle,layerWave:rLayerWave,waveSplit:rWaveSplit,marquee:rMarquee};

// ── Render loop ──
const clock=new THREE.Clock();
(function animate(){requestAnimationFrame(animate);const dt=clock.getDelta(),t=clock.getElapsedTime();updateView(dt);const rn=RR[anim]||rCenterSplit;
for(const{m,led}of meshes){const b=rn(led,t);m.material.emissiveIntensity=b*3;m.material.opacity=.4+b*.55;}
controls.update();composer.render();})();
</script>
</body>
