<title>星空尾灯数字孪生系统</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06060e;color:#c8c8e0;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;overflow-x:hidden;overflow-y:auto;height:100vh}

/* ═══ Animated Stars Background ═══ */
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.star-particle{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite;opacity:0;will-change:transform,opacity}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:var(--op);transform:scale(1.2)}}
@keyframes drift{0%{transform:translateY(0)}100%{transform:translateY(-100vh)}}

/* ═══ Landing Page ═══ */
#landing{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1),filter .8s cubic-bezier(.4,0,.2,1);
  background:#06060e}
#landing.hide{opacity:0;transform:scale(1.03);filter:blur(8px);pointer-events:none}

/* Car photo background */
.car-bg{position:absolute;top:0;left:0;width:100%;height:100%;
  background-size:cover;background-position:center;opacity:.6;
  filter:brightness(.5) saturate(.8)}
.car-bg::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 55%,transparent 35%,#06060e 85%)}

/* Tail light glow */
.glow-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.glow-spot{position:absolute;border-radius:50%;box-shadow:0 0 120px 60px rgba(255,40,40,.2);animation:glow 3.5s ease-in-out infinite;will-change:transform,opacity}
.glow-spot.l{left:18%;top:42%;width:200px;height:60px;background:rgba(255,40,40,.2)}
.glow-spot.r{right:18%;top:42%;width:200px;height:60px;background:rgba(255,40,40,.2)}
.glow-spot.c{left:50%;top:44%;width:160px;height:35px;transform:translateX(-50%);background:rgba(255,60,60,.08)}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.6}}

.landing-content{position:relative;z-index:2;text-align:center}
.landing-title h1{font-size:42px;font-weight:800;
  background:linear-gradient(135deg,#ff3030,#ff6040,#ff3030);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:4px;margin-bottom:10px;
  text-shadow:0 0 60px rgba(255,60,60,.15)}
.landing-title p{font-size:13px;color:#556;letter-spacing:2px;margin-bottom:44px;font-weight:300}
.landing-title p span{color:#ff6040;font-weight:500}

/* Effect Grid */
.effect-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:780px;width:100%}
.effect-card{background:rgba(10,10,20,.6);border:1px solid rgba(100,120,200,.06);
  border-radius:14px;padding:26px 18px;cursor:pointer;text-align:center;
  transition:all .4s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
  backdrop-filter:blur(12px)}
.effect-card.selected{border-color:rgba(255,60,60,.35);background:rgba(255,60,60,.05);box-shadow:0 0 30px rgba(255,60,60,.1)}
.effect-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#ff4040,transparent);opacity:0;transition:opacity .3s}
.effect-card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(255,60,60,.04) 0%,transparent 60%);opacity:0;transition:opacity .3s}
.effect-card:hover{border-color:rgba(255,80,60,.2);transform:translateY(-8px) scale(1.02);
  box-shadow:0 16px 48px rgba(255,40,40,.08),0 0 0 1px rgba(255,60,60,.03),inset 0 -1px 0 rgba(255,60,60,.15)}
.effect-card:hover::before{opacity:1}
.effect-card:hover::after{opacity:1}
.effect-card:active{transform:translateY(-4px) scale(.99)}
.effect-card .icon{font-size:34px;margin-bottom:12px;display:block;
  filter:drop-shadow(0 0 12px rgba(255,60,60,.15))}
.effect-card .name{font-size:15px;color:#e0e0f0;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.effect-card .desc{font-size:11px;color:#556;line-height:1.5;font-weight:300}

/* ═══ Preview Page ═══ */
#preview{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;z-index:50;opacity:0;pointer-events:none;transition:opacity .5s;overflow-y:auto}
#preview.show{opacity:1;pointer-events:auto}

.header{display:flex;align-items:center;height:40px;
  background:linear-gradient(180deg,rgba(12,12,24,.96),rgba(8,8,16,.92));
  border-bottom:1px solid rgba(100,120,200,.08);padding:0 20px;gap:14px;flex-shrink:0;
  backdrop-filter:blur(20px)}
.back-btn{background:none;border:1px solid rgba(255,80,60,.12);color:#ff6040;
  padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .25s;
  font-weight:500;letter-spacing:.5px}
.back-btn:hover{border-color:rgba(255,80,60,.35);background:rgba(255,60,60,.05);
  box-shadow:0 0 12px rgba(255,60,60,.06)}
.header .logo{font-size:14px;font-weight:800;
  background:linear-gradient(135deg,#ff4040,#ff8060);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:1px}
.header-tabs{display:flex;gap:2px;margin-left:16px}
.header-tabs button{background:none;border:none;color:#556;padding:7px 14px;font-size:13px;
  cursor:pointer;border-radius:6px;transition:all .25s;font-weight:500}
.header-tabs button:hover{color:#99a;background:rgba(100,120,200,.05)}
.header-tabs button.active{color:#ff6040;background:rgba(255,60,60,.1);
  box-shadow:0 2px 0 0 #ff6040,inset 0 0 12px rgba(255,60,60,.06);font-weight:700}
.header-right{margin-left:auto;display:flex;gap:10px}
.badge{background:rgba(100,120,200,.05);border:1px solid rgba(100,120,200,.08);
  padding:3px 10px;border-radius:10px;font-size:10px;color:#667;font-weight:500}

.main{position:relative;flex:1;overflow:auto;padding:4px}
.preview-area{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}

/* Car silhouette */
.car-sil{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:85%;max-width:1000px;opacity:.03;pointer-events:none;
  filter:blur(1px)}
.car-sil img{width:100%;height:auto;filter:brightness(.5) contrast(1.1)}

canvas{border-radius:8px;position:relative;z-index:1;
  box-shadow:0 0 40px rgba(0,0,0,.3),0 0 0 1px rgba(100,120,200,.04)}
.hud{position:absolute;top:14px;left:18px;font-size:11px;color:#445;pointer-events:none;font-family:'SF Mono','JetBrains Mono',monospace;z-index:2}
.hud .mn{color:#ff6040;font-size:13px;font-weight:700;letter-spacing:.5px}
.hud .t{color:#556;font-size:10px}

/* Sidebar */
.sidebar{width:200px;background:rgba(10,10,18,.92);border-left:1px solid rgba(100,120,200,.05);
  overflow-y:auto;flex-shrink:0;backdrop-filter:blur(20px);
  position:fixed;top:40px;right:0;height:calc(100vh - 40px);z-index:10;
  box-shadow:-4px 0 20px rgba(0,0,0,.4)}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(100,120,200,.1);border-radius:2px}
.panel{padding:8px 8px;margin:3px 4px;border-radius:8px;
  background:rgba(100,120,200,.02);border:1px solid rgba(100,120,200,.04)}
.panel-title{font-size:10px;color:#445;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.panel-title:hover{color:#667}
.panel-title .chevron{font-size:10px;transition:transform .25s;color:#334}
.params-header{text-align:right;margin-bottom:6px}
.panel.collapsed .panel-body{display:none}
.panel.collapsed .chevron{transform:rotate(-90deg)}
.reset-btn{background:none;border:1px solid rgba(100,120,200,.1);color:#667;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:9px;letter-spacing:0;text-transform:none;font-weight:500;transition:all .25s}
.reset-btn:hover{border-color:rgba(255,80,60,.2);color:#ff6040}
.param-row{margin-bottom:8px}
.param-row .lbl{display:flex;justify-content:space-between;font-size:10px;color:#889;margin-bottom:3px}
.param-row .lbl .v{color:#ff6040;font-weight:700;font-family:'SF Mono','JetBrains Mono',monospace;font-size:11px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;
  background:linear-gradient(90deg,rgba(100,120,200,.08),rgba(255,60,60,.15),rgba(100,120,200,.12));
  border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  background:radial-gradient(circle,#ff6040,#cc4030);border-radius:50%;cursor:pointer;
  box-shadow:0 0 8px rgba(255,60,60,.25),0 2px 4px rgba(0,0,0,.3)}

/* Color Grid */
.color-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center}
.color-grid label{font-size:10px;color:#889}
.color-grid input[type=color]{width:28px;height:20px;border:1px solid rgba(100,120,200,.08);
  border-radius:3px;background:none;cursor:pointer;padding:0}

/* Preset Grid */
.preset-grid{display:flex;flex-wrap:wrap;gap:4px}
.preset-btn{background:rgba(100,120,200,.04);border:1px solid rgba(100,120,200,.08);
  color:#889;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:11px;transition:all .25s;
  font-weight:600}
.preset-btn:hover{border-color:rgba(255,80,60,.2);color:#aaa;
  box-shadow:0 0 10px rgba(255,60,60,.04)}
.preset-btn:active{transform:scale(.96)}

/* Playback */
.panel-playback{background:rgba(255,60,60,.02);border-bottom:1px solid rgba(255,60,60,.06)}
.playback{display:flex;align-items:center;gap:7px}
.playback-hint{font-size:9px;color:#445;margin-top:6px;text-align:center;letter-spacing:.5px}
.color-save-row{display:flex;flex-direction:column;gap:10px}
.save-actions{display:flex;gap:6px}
.action-btn{flex:1;background:rgba(100,120,200,.04);border:1px solid rgba(100,120,200,.08);
  color:#889;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .25s;
  font-weight:600;text-align:center}
.action-btn:hover{border-color:rgba(255,80,60,.2);color:#aaa;
  box-shadow:0 0 8px rgba(255,60,60,.04)}
.action-btn:active{transform:scale(.96)}
.action-btn.active{border-color:rgba(80,160,80,.3);color:#6a6;
  background:rgba(80,160,80,.06)}
.play-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,60,60,.15);
  background:rgba(255,60,60,.05);color:#ff6040;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .25s}
.play-btn:hover{border-color:rgba(255,80,60,.4);color:#ff8060;
  box-shadow:0 0 12px rgba(255,60,60,.1)}
.play-btn.primary{background:rgba(255,60,60,.12);border-color:rgba(255,60,60,.3);
  color:#ff6040;box-shadow:0 0 20px rgba(255,60,60,.12);animation:playPulse 2s ease-in-out infinite}
@keyframes playPulse{0%,100%{box-shadow:0 0 20px rgba(255,60,60,.12)}50%{box-shadow:0 0 28px rgba(255,60,60,.22)}}
.time-bar{flex:1;height:6px;background:rgba(100,120,200,.06);border-radius:2px;cursor:pointer;
  overflow:hidden}
.time-bar .fill{height:100%;background:linear-gradient(90deg,#ff4040,#ff8060);
  border-radius:2px;transition:width .05s}
.time-text{font-size:9px;color:#556;font-family:'SF Mono','JetBrains Mono',monospace;min-width:65px;text-align:right}

/* Export */
.export-btn{width:100%;background:rgba(80,160,80,.04);border:1px solid rgba(80,160,80,.08);
  color:#8c9;padding:10px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .3s;
  font-weight:600;letter-spacing:.5px;position:relative;overflow:hidden}
.export-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(80,160,80,.4),transparent);opacity:0;transition:opacity .3s}
.export-btn:hover::before{opacity:1}
.export-btn:hover{background:rgba(80,160,80,.1);border-color:rgba(80,160,80,.2);
  box-shadow:0 0 12px rgba(80,160,80,.06)}

/* Fade-in animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .6s ease-out forwards;opacity:0}
.fade-up:nth-child(1){animation-delay:.1s}
.fade-up:nth-child(2){animation-delay:.18s}
.fade-up:nth-child(3){animation-delay:.26s}
.fade-up:nth-child(4){animation-delay:.34s}
.fade-up:nth-child(5){animation-delay:.42s}
.fade-up:nth-child(6){animation-delay:.5s}
.fade-up:nth-child(7){animation-delay:.58s}

/* Pulse ring on landing */
.pulse-ring{position:absolute;width:300px;height:300px;border-radius:50%;
  border:1px solid rgba(255,60,60,.06);animation:pulseRing 4s ease-out infinite;
  pointer-events:none;top:50%;left:50%;transform:translate(-50%,-50%);will-change:transform,opacity}
@keyframes pulseRing{0%{transform:translate(-50%,-50%) scale(.8);opacity:.4}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}

/* Scanline effect */
.scanline{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.01) 3px,rgba(0,0,0,.01) 6px)}

/* Header buttons */
.hdr-btn{background:rgba(255,60,60,.06);border:1px solid rgba(255,60,60,.15);color:#ff6040;
  padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .25s;
  font-weight:600;white-space:nowrap}
.hdr-btn:hover{border-color:rgba(255,80,60,.4);color:#ff8060;
  box-shadow:0 0 12px rgba(255,60,60,.12);background:rgba(255,60,60,.1)}
.hdr-btn:active{transform:scale(.94)}

/* Toast notification */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,30,.95);border:1px solid rgba(100,120,200,.12);
  color:#c8c8e0;padding:10px 20px;border-radius:10px;font-size:12px;
  z-index:10000;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* Fullscreen starry background */
#preview:fullscreen{background:#06060e}
#preview:fullscreen .stars{display:block}
#preview:-webkit-full-screen{background:#06060e}
#preview:-webkit-full-screen .stars{display:block}

/* ═══ AI Animation Panel ═══ */
.ai-panel{background:rgba(255,60,60,.02);border:1px solid rgba(255,60,60,.08)}
.ai-input-row{display:flex;gap:6px;margin-bottom:8px}
.ai-input{flex:1;background:rgba(10,10,20,.8);border:1px solid rgba(100,120,200,.1);
  color:#c8c8e0;padding:8px 10px;border-radius:8px;font-size:12px;outline:none;
  font-family:inherit;resize:none;min-height:36px;max-height:80px}
.ai-input::placeholder{color:#445}
.ai-input:focus{border-color:rgba(255,60,60,.3);box-shadow:0 0 8px rgba(255,60,60,.06)}
.ai-send{background:rgba(255,60,60,.12);border:1px solid rgba(255,60,60,.25);color:#ff6040;
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;
  transition:all .25s;white-space:nowrap}
.ai-send:hover{background:rgba(255,60,60,.2);border-color:rgba(255,80,60,.4)}
.ai-send:disabled{opacity:.4;cursor:not-allowed}
.ai-status{font-size:10px;color:#556;min-height:16px;line-height:1.5;margin-top:4px}
.ai-status.error{color:#f66}
.ai-status.ok{color:#6a6}
.ai-key-row{display:flex;gap:6px;margin-bottom:8px}
.ai-key{flex:1;background:rgba(10,10,20,.8);border:1px solid rgba(100,120,200,.1);
  color:#889;padding:5px 8px;border-radius:6px;font-size:10px;outline:none;font-family:monospace}
.ai-key::placeholder{color:#334}
.ai-key:focus{border-color:rgba(255,60,60,.2)}
.ai-key-btn{background:rgba(100,120,200,.06);border:1px solid rgba(100,120,200,.1);color:#667;
  padding:5px 10px;border-radius:6px;cursor:pointer;font-size:10px;transition:all .25s}
.ai-key-btn:hover{border-color:rgba(255,80,60,.2);color:#ff6040}
.ai-tag{display:inline-block;background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.2);
  color:#ff6040;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-top:6px}

/* ═══ 美化增强 ═══ */
#landing { background:#04040c; }
.landing-title h1 {
  font-size:52px !important; font-weight:900 !important; letter-spacing:6px !important;
  background:linear-gradient(135deg,#ff1818 0%,#ff5030 38%,#ffb060 62%,#ff2828 100%) !important;
  -webkit-background-clip:text !important;-webkit-text-fill-color:transparent !important;
  filter:drop-shadow(0 0 28px rgba(255,55,30,.32)) !important;
  margin-bottom:6px !important;
}
.landing-title p {
  font-size:12px !important;color:#3a3a52 !important;letter-spacing:3px !important;
  margin-bottom:34px !important;font-weight:300 !important;text-transform:uppercase !important;
}
.landing-title p span { color:#ff6040 !important;font-weight:600 !important; }

.effect-grid {
  grid-template-columns:repeat(auto-fill,minmax(128px,1fr)) !important;
  gap:10px !important; max-width:960px !important;
}
.effect-card {
  background:linear-gradient(155deg,rgba(16,12,30,.9),rgba(8,8,20,.95)) !important;
  border:1px solid rgba(255,255,255,.06) !important;
  border-radius:16px !important;padding:14px 12px 14px !important;
  backdrop-filter:blur(18px) !important;
  box-shadow:0 4px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04) !important;
}
.effect-card:hover {
  transform:translateY(-6px) scale(1.01) !important;
  box-shadow:0 12px 36px rgba(255,40,40,.1),0 0 0 1px rgba(255,60,60,.08) !important;
  border-color:rgba(255,60,60,.15) !important;
}

function resize(){
  const pa=cv.parentElement,pw=pa.clientWidth-24-200,ph=pa.clientHeight-24;
  W=Math.min(pw,9600);
  scale=(W-40)/(2*A);
  H=Math.min(ph*8,8*(2*B*scale+80));
  cv.width=W;cv.height=H;cx=W/2;cy=H/2;
  const scaley=scale;
  /* [OPT1] cache background to OffscreenCanvas */
  bgCanvas=document.createElement('canvas');bgCanvas.width=W;bgCanvas.height=H;
  const bg=bgCanvas.getContext('2d');
  bg.fillStyle='#06060e';bg.fillRect(0,0,W,H);
  bg.strokeStyle='rgba(100,120,200,.08)';bg.lineWidth=1.5;bg.lineJoin='round';
  bg.beginPath();
  for(let i=0;i<=120;i++){const px=(i/120*2-1)*A,ue=B*Math.pow(1-Math.min((px/A)**2,1),.4),sx=cx+px*scale,sy=cy-ue*scale;i===0?bg.moveTo(sx,sy):bg.lineTo(sx,sy)}
  for(let i=120;i>=0;i--){const px=(i/120*2-1)*A,ue=B*Math.pow(1-Math.min((px/A)**2,1),.4);bg.lineTo(cx+px*scale,cy+ue*scale)}
  bg.closePath();bg.stroke();bg.fillStyle='rgba(20,10,15,.08)';bg.fill();
  const hw=170*scale,hh=38*scale;
  bg.strokeStyle='rgba(100,120,200,.03)';bg.lineWidth=1;bg.strokeRect(cx-hw,cy-hh,hw*2,hh*2);
  /* [OPT2] pre-compute LED screen coordinates */
  for(let i=0;i<N;i++){const l=LEDS[i];l.sx=cx+l.x*scale;l.sy=cy-l.y*scale;if(l.circles){l.circles.forEach(c=>{c.sx=cx+c.x*scale;c.sy=cy-c.y*scale})}}
}

function enterEffect(eff){
  document.querySelectorAll('.effect-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('landing').classList.add('hide');
  setTimeout(()=>{
    document.getElementById('landing').style.display='none';
    document.getElementById('preview').classList.add('show');
    currentMode=MODES.find(m=>m.id===eff.mode);
    currentMode.params.forEach(p=>{p.val=eff.p[p.id]??p.val});
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{

        if(!frameRunning){frameRunning=true;frame()}

  },700);
}

/* ═══ Heatmap module — 8-stop LUT + unified renderer + legend ═══ */
const Heatmap = (function(){
  const STOPS = [
    { p: 0.00, c: [  0,   0, 128] },
    { p: 0.12, c: [  0,  50, 200] },
    { p: 0.25, c: [  0, 160, 220] },
    { p: 0.37, c: [  0, 210, 100] },
    { p: 0.50, c: [ 60, 230,  30] },
    { p: 0.62, c: [200, 220,  20] },
    { p: 0.75, c: [255, 160,   0] },
    { p: 0.87, c: [255,  60,   0] },
    { p: 1.00, c: [200,  20,  30] },
  ];
  function buildLUT(){
    heatmapLUT = new Uint8Array(256 * 3);
    let si = 0;
    for(let v = 0; v < 256; v++){
      const n = v / 255;
      while(si < STOPS.length - 2 && STOPS[si + 1].p < n) si++;
      const a = STOPS[si], b = STOPS[si + 1];
      const t = (n - a.p) / (b.p - a.p || 1);
      const s = t * t * (3 - 2 * t);
      heatmapLUT[v * 3]     = (a.c[0] + (b.c[0] - a.c[0]) * s) | 0;
      heatmapLUT[v * 3 + 1] = (a.c[1] + (b.c[1] - a.c[1]) * s) | 0;
      heatmapLUT[v * 3 + 2] = (a.c[2] + (b.c[2] - a.c[2]) * s) | 0;
    }
  }
  buildLUT();

  /* legend offscreen canvas */
  const LW = 18, LH = 200;
  const legCvs = document.createElement('canvas');
  legCvs.width = LW; legCvs.height = LH;
  const lctx = legCvs.getContext('2d');
  const lg = lctx.createLinearGradient(0, LH, 0, 0);
  STOPS.forEach(s => lg.addColorStop(s.p, 'rgb('+s.c[0]+','+s.c[1]+','+s.c[2]+')'));
  lctx.fillStyle = lg; lctx.fillRect(0, 0, LW, LH);

  /* ── render one LED (unified for all render paths) ── */
  function renderOne(ctx, l, bv, bR, bG, bB, scl){
    const idx = Math.min(255, Math.max(0, (bv * 255) | 0));
    const cr = heatmapLUT[idx * 3], cg = heatmapLUT[idx * 3 + 1], cb = heatmapLUT[idx * 3 + 2];
    if(l.circles && l.circles.length){
      const grps = [[], [], []];
      l.circles.forEach(c => grps[c._cat || 0].push(c));
      grps.forEach((arr, gi) => {
        if(!arr.length) return;
        const szMul = gi === 2 ? 1.2 : gi === 1 ? 1.6 : 2.0;
        const gMul  = (gi + 1) * 1.5;
        arr.forEach(c => {
          const r0 = Math.max(0.8, (c._r || 0.5) * scl * szMul);
          const grd = ctx.createRadialGradient(c.sx, c.sy, r0 * 0.2, c.sx, c.sy, r0 * gMul);
          grd.addColorStop(0,   'rgba('+cr+','+cg+','+cb+','+(bv*0.7).toFixed(2)+')');
          grd.addColorStop(0.5, 'rgba('+cr+','+cg+','+cb+','+(bv*0.06).toFixed(2)+')');
          grd.addColorStop(1,   'rgba('+cr+','+cg+','+cb+',0)');
          ctx.fillStyle = grd; ctx.beginPath();
          ctx.arc(c.sx, c.sy, r0 * gMul, 0, Math.PI * 2); ctx.fill();
        });
        ctx.fillStyle = 'rgb('+cr+','+cg+','+cb+')';
        ctx.beginPath();
        arr.forEach(c => {
          const r0 = Math.max(0.8, (c._r || 0.5) * scl * szMul);
          ctx.moveTo(c.sx + r0, c.sy);
          ctx.arc(c.sx, c.sy, r0, 0, Math.PI * 2);
        });
        ctx.fill();
      });
    } else {
      const sz = Math.max(2, 2 + l.rn * 3);
      const grd = ctx.createRadialGradient(l.sx, l.sy, sz * 0.2, l.sx, l.sy, sz * 4);
      grd.addColorStop(0,   'rgba('+cr+','+cg+','+cb+','+(bv*0.7).toFixed(2)+')');
      grd.addColorStop(0.5, 'rgba('+cr+','+cg+','+cb+','+(bv*0.06).toFixed(2)+')');
      grd.addColorStop(1,   'rgba('+cr+','+cg+','+cb+',0)');
      ctx.fillStyle = grd; ctx.beginPath();
      ctx.arc(l.sx, l.sy, sz * 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgb('+cr+','+cg+','+cb+')';
      ctx.beginPath();
      ctx.arc(l.sx, l.sy, sz, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ── draw legend overlay ── */
  function drawLegend(ctx, W, H, sumB, N, maxB){
    const x = W - 42, y = 20;
    ctx.drawImage(legCvs, x, y, LW, LH);
    ctx.fillStyle = '#c8c8e0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('1.0', x + LW / 2, y - 4);
    ctx.fillText('0.5', x + LW / 2, y + LH / 2 + 3);
    ctx.fillText('0.0', x + LW / 2, y + LH + 12);
    ctx.font = '9px sans-serif'; ctx.fillStyle = '#7878a0';
    ctx.fillText('avg ' + (sumB / N).toFixed(3), x + LW / 2, y + LH + 24);
    ctx.fillText('peak ' + maxB.toFixed(3),  x + LW / 2, y + LH + 36);
  }

  return { renderOne, drawLegend };
})();

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

const DSLRenderers = {
  wave(nx, ny, gr, t, p) {
    const dir = p.direction || 'ltr', speed = p.speed || 1, freq = p.frequency || 1.0;
    let coord;
    if (dir === 'ltr') coord = nx; else if (dir === 'rtl') coord = 1 - nx;
    else if (dir === 'ttb') coord = ny; else if (dir === 'btt') coord = 1 - ny;

  },
  meteor(nx, ny, gr, t, p) {
    const count = Math.max(1, p.count || 3), dir = p.direction || 'ltr', len = p.tailLength || 0.3, speed = p.speed || 1;
    let v = 0;
    for (let i = 0; i < count; i++) {
      const off = i / count, phase = (t * speed * 0.4 + off) % 1;
      let coord;
      if (dir === 'ltr') coord = nx; else if (dir === 'rtl') coord = 1 - nx;
      else if (dir === 'ttb') coord = ny; else coord = 1 - ny;
      const d = Math.abs(coord - phase);
      const dist = Math.min(d, 1 - d);
      if (dist < len) v = Math.max(v, 1 - dist / len);
    }
    return v;
  },
  breath(nx, ny, gr, t, p) {
    const period = p.period || 3, mn = p.min || 0, mx = p.max || 1;
    return mn + (mx - mn) * (Math.sin(t * Math.PI * 2 / period) + 1) * 0.5;
  },
  ripple(nx, ny, gr, t, p) {
    const cx = (p.center && p.center[0]) || 0.5, cy = (p.center && p.center[1]) || 0.5;
    const speed = p.speed || 1, rw = p.ringWidth || 0.1, rings = p.rings || 3;
    const d = Math.sqrt((nx - cx) ** 2 + (ny - cy) ** 2);
    const wave = (d * rings - t * speed) % 1;
    return wave > 0 && wave < rw ? 1 - Math.abs(wave - rw / 2) / (rw / 2) : 0;
  },
  burst(nx, ny, gr, t, p) {
    const cx = (p.center && p.center[0]) || 0.5, cy = (p.center && p.center[1]) || 0.5;
    const d = Math.sqrt((nx - cx) ** 2 + (ny - cy) ** 2);

  chase(nx, ny, gr, t, p) {
    const speed = p.speed || 1, width = p.width || 0.15;

    const dist = Math.min(d, 1 - d);
    return dist < width ? 1 - dist / width : 0;
  },
  scan(nx, ny, gr, t, p) {
    const dir = p.direction || 'ltr', speed = p.speed || 1, width = p.width || 0.08;
    let coord;
    if (dir === 'ltr') coord = nx; else if (dir === 'rtl') coord = 1 - nx;
    else if (dir === 'ttb') coord = ny; else coord = 1 - ny;

    return ph < 0.15 ? Math.sin(ph / 0.15 * Math.PI) : Math.max(0, 1 - (ph - 0.15) * 3);
  },
  aurora(nx, ny, gr, t, p) {
    const speed = p.speed || 0.5;
    return (Math.sin(nx * 4 + t * speed * 3) * Math.cos(ny * 3 - t * speed * 2) + 1) * 0.5;
  },
  idle() { return 0; }
};

// ═══ AI Mode State ═══
let aiDSLPlan = null;    // 当前 AI 生成的 DSL plan
let aiDSLTime = 0;       // AI 模式的时间
let aiDSLDuration = 10;  // AI 模式总时长
let aiMode = false;       // 是否在 AI 模式

function renderDSLFrame(plan, t, leds) {
  const duration = plan.duration || 10;
  const intensity = plan.intensity != null ? plan.intensity : 1;
  // 预计算归一化坐标范围
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const l of leds) { if (l.x < minX) minX = l.x; if (l.x > maxX) maxX = l.x; if (l.y < minY) minY = l.y; if (l.y > maxY) maxY = l.y; }
  const rangeX = maxX - minX || 1, rangeY = maxY - minY || 1;

  const result = new Float32Array(leds.length);
  for (const tr of (plan.tracks || [])) {
    if (t < (tr.start || 0) || t > (tr.end || duration)) continue;
    const renderer = DSLRenderers[tr.type];
    if (!renderer) continue;
    const fadeIn = tr.fadeIn || 0, fadeOut = tr.fadeOut || 0;
    let fade = 1;
    const localT = t - (tr.start || 0);
    const trackDur = (tr.end || duration) - (tr.start || 0);
    if (fadeIn > 0 && localT < fadeIn) fade = localT / fadeIn;
    if (fadeOut > 0 && localT > trackDur - fadeOut) fade = (trackDur - localT) / fadeOut;
    fade = clamp01(fade);
    const weight = (tr.weight != null ? tr.weight : 1) * fade;

    for (let i = 0; i < leds.length; i++) {
      const l = leds[i];
      const nx = (l.x - minX) / rangeX, ny = (l.y - minY) / rangeY;
      const bv = renderer(nx, ny, l.g, t, tr.params || {}, duration);
      result[i] = Math.max(result[i], bv * weight);
    }
  }
  // Apply intensity
  for (let i = 0; i < result.length; i++) result[i] = Math.min(1, result[i] * intensity);
  return result;
}

// ═══ AI UI Logic ═══
function initAI() {
  const keyInput = document.getElementById('aiKey');
  const keyBtn = document.getElementById('aiKeyBtn');
  const aiInput = document.getElementById('aiInput');
  const aiSend = document.getElementById('aiSend');
  const aiStatus = document.getElementById('aiStatus');
  const aiTagWrap = document.getElementById('aiTagWrap');

  // Load saved key
  keyInput.value = AI.getKey();

  keyBtn.onclick = () => {
    AI.setKey(keyInput.value.trim());
    aiStatus.textContent = '✓ Key 已保存';
    aiStatus.className = 'ai-status ok';
  };

  keyInput.onkeydown = (e) => { if (e.key === 'Enter') keyBtn.click(); };

  aiSend.onclick = async () => {
    const text = aiInput.value.trim();
    if (!text) return;
    if (!AI.getKey()) {
      aiStatus.textContent = '请先填写 API Key';
      aiStatus.className = 'ai-status error';
      return;
    }

    aiSend.disabled = true;
    aiStatus.textContent = '⏳ AI 生成中...';
    aiStatus.className = 'ai-status';

    try {
      const plan = await AI.callLLM(text, (len) => {
        aiStatus.textContent = '⏳ AI 生成中... (' + len + ' chars)';
      });

      // Validate
      if (!plan.tracks || !plan.tracks.length) throw new Error('AI 未返回动画轨道');

      // Enter AI mode
      aiDSLPlan = plan;
      aiDSLDuration = plan.duration || 10;
      aiDSLTime = 0;
      aiMode = true;

      // Stop preset rendering, start AI rendering
      if (!playing) { playing = true; document.getElementById('btnPlay').textContent = '⏸'; document.getElementById('btnPlay').className = 'play-btn primary'; }
      if (!frameRunning) { frameRunning = true; frame(); }
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(frame);

      // Show tag
      const trackTypes = [...new Set(plan.tracks.map(t => t.type))];
      aiTagWrap.innerHTML = '<span class="ai-tag">AI: ' + trackTypes.join(' + ') + ' · ' + aiDSLDuration + 's</span>';

      aiStatus.textContent = '✓ 生成完成 · ' + plan.tracks.length + ' 轨道 · ' + aiDSLDuration + 's';
      aiStatus.className = 'ai-status ok';

      // Update HUD
      document.getElementById('timeDisp').textContent = '0.00/' + aiDSLDuration + 's';

    } catch (err) {
      aiStatus.textContent = '✗ ' + err.message;
      aiStatus.className = 'ai-status error';
    } finally {
      aiSend.disabled = false;
    }
  };

  // Enter key to send
  aiInput.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); aiSend.click(); }
  };

  // Click on preset → exit AI mode
  const origEnter = window.enterEffect;
  if (origEnter) {
    window.enterEffect = function(eff) {
      aiMode = false;
      aiDSLPlan = null;
      aiTagWrap.innerHTML = '';
      origEnter(eff);
    };
  }
}

// Hook into existing system: override frame() to support AI mode
const _origFrame = frame;
frame = function() {
  if (aiMode && aiDSLPlan) {
    // AI rendering path
    rafId = requestAnimationFrame(frame);
    if (!playing) return;
    aiDSLTime += 1 / FPS;
    if (aiDSLTime >= aiDSLDuration) aiDSLTime -= aiDSLDuration;
    t = aiDSLTime;

    // Render DSL
    const bvArr = renderDSLFrame(aiDSLPlan, aiDSLTime, LEDS);
    const [wR, wG, wB] = hexRGB(document.getElementById('colorWave').value);
    const [bR, bG, bB] = hexRGB(document.getElementById('colorBase').value);

    ctx.save();ctx.translate(cx+panX,cy+panY);ctx.scale(zoomLevel,zoomLevel);ctx.translate(-cx,-cy);ctx.drawImage(bgCanvas, 0, 0);
    const isHeatmap = viewMode === 'heatmap';
    const glowArr = [];

    for (let i = 0; i < N; i++) {
      const l = LEDS[i], bv = bvArr[i];
      let r, g, b, sz;
      if (isHeatmap) {
        Heatmap.renderOne(ctx, l, bv, bR, bG, bB, scale);
        continue;
      } else {
        const e = bv * bv * (3 - 2 * bv); r = bR + (wR - bR) * e; g = bG + (wG - bG) * e; b = bB + (wB - bB) * e;
        if (bv > .6) { const gl = (bv - .6) * 2.5; r = Math.min(255, r + gl * 40); g = Math.min(255, g + gl * 15); }
        sz = Math.max(1.2, 1 + l.rn * 2.5);
      }
      if(l.circles && l.circles.length > 0) {
        // Batch circles by size category for overlap rendering
        const batchLarge = [], batchMid = [], batchSmall = [];
        l.circles.forEach(c => {
          if (c._cat===0) batchLarge.push(c);
          else if (c._cat===1) batchMid.push(c);
          else batchSmall.push(c);
        });
        [[batchLarge, 0], [batchMid, 1], [batchSmall, 2]].forEach(([arr, idx]) => {
          if (arr.length === 0) return;
          const _cr = [idx===0?[255,200,185]:idx===1?[240,70,25]:[140,10,8]][0];
          const _ce = bv*bv*(3-2*bv);
          const fr=((bR+(_cr[0]-bR)*_ce)|0),fg=((bG+(_cr[1]-bG)*_ce)|0),fb=((bB+(_cr[2]-bB)*_ce)|0);
          const glowMul = idx === 2 ? 4 : 6;
          // Draw glow around each circle
          arr.forEach(c => {
            const r = Math.max(0.8, c.r * scale);
            const grad = ctx.createRadialGradient(c.sx, c.sy, r*0.3, c.sx, c.sy, r*glowMul);
            grad.addColorStop(0, 'rgba('+fr+','+fg+','+fb+','+(_ce*0.8)+')');
            grad.addColorStop(0.3, 'rgba('+fr+','+fg+','+fb+','+(_ce*0.05)+')');
            grad.addColorStop(1, 'rgba('+fr+','+fg+','+fb+',0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(c.sx, c.sy, r*glowMul, 0, Math.PI*2); ctx.fill();
          });
          // Draw solid circles
          ctx.fillStyle='rgb('+fr+','+fg+','+fb+')';
          ctx.beginPath();
          arr.forEach(c => { ctx.moveTo(c.sx + Math.max(0.8, c.r * scale), c.sy); ctx.arc(c.sx, c.sy, Math.max(0.8, c.r * scale), 0, Math.PI * 2); });
          ctx.fill();
        });
        if (!isHeatmap && bv > .5) l.circles.forEach(c => glowArr.push([c.sx, c.sy, wR, wG, wB, bv, Math.max(0.8, c.r * scale)]));
      } else {
        ctx.beginPath(); ctx.arc(l.sx, l.sy, sz, 0, Math.PI * 2); ctx.fill();
        if (!isHeatmap && bv > .5) glowArr.push([l.sx, l.sy, wR, wG, wB, bv, sz]);
      }
    }
    for (let i = 0; i < glowArr.length; i++) { const [sx, sy, wr, wg, wb, bv, sz] = glowArr[i];
      ctx.fillStyle = 'rgba(' + wr + ',' + wg + ',' + wb + ',' + ((bv - .5) * .08) + ')'; ctx.beginPath(); ctx.arc(sx, sy, sz * 3.5, 0, Math.PI * 2); ctx.fill(); }
    if(isHeatmap) Heatmap.drawLegend(ctx, W, H, sumB, N, maxB);
    ctx.restore();
    // HUD
    let sumB = 0, maxB = 0;
    for (let i = 0; i < N; i++) { const v = bvArr[i]; sumB += v; if (v > maxB) maxB = v; }
    document.getElementById('hud').innerHTML =
      '<span class="mn">🤖 AI 动画</span>' +
      (isHeatmap ? ' <span style="color:#ff6040;font-size:10px">[热力图]</span>' : '') + '<br>' +
      '<span class="t">帧 ' + Math.floor(aiDSLTime * FPS) + '/' + Math.floor(aiDSLDuration * FPS) + ' · LED ' + N + ' · 平均 ' + (sumB / N).toFixed(3) + ' · 峰值 ' + maxB.toFixed(3) + '</span>';
    document.getElementById('timeDisp').textContent = aiDSLTime.toFixed(2) + '/' + aiDSLDuration + 's';
    document.getElementById('timeFill').style.width = (aiDSLTime / aiDSLDuration * 100) + '%';
  } else {
    // Original preset rendering path
    _origFrame();
  }
};

// ─── 多段时序状态 ──────────────────────────────────
var _tlSegs=[],_tlDur=0,_tlOn=false,_tlLoop=true;
const _FADE=0.65; // crossfade 秒数

function _tlStop(silent){
  _tlOn=false; _tlSegs=[]; t=0;
  const st=document.getElementById('tlStatus'); if(st)st.textContent='待机';
  const bar=document.getElementById('tlBar'); if(bar)bar.innerHTML='';
  if(!silent)showToast('时序已停止');
}

// ─── 新 frame 主循环 ──────────────────────────────
function _frame(){
  if(!playing){frameRunning=false;return;}
  rafId=requestAnimationFrame(_frame);
  t+=1/FPS;

  // 时间环绕
  if(_tlOn&&_tlDur>0){
    if(t>=_tlDur){if(_tlLoop){t-=_tlDur;}else{playing=false;frameRunning=false;_tlStop(true);return;}}
  } else {
    if(t>=DURATION)t-=DURATION;
  }

  const [wR,wG,wB]=hexRGB(document.getElementById('colorWave').value);
  const [bR,bG,bB]=hexRGB(document.getElementById('colorBase').value);
  ctx.save();ctx.translate(cx+panX,cy+panY);ctx.scale(zoomLevel,zoomLevel);ctx.translate(-cx,-cy);ctx.drawImage(bgCanvas,0,0);
  const isHM=viewMode==='heatmap';

  if(_tlOn&&_tlSegs.length){
    // ── 时序模式 ──
    const tL=t%(_tlDur||1);
    // 找当前段
    let ci=0;
    for(let i=_tlSegs.length-1;i>=0;i--){if(tL>=_tlSegs[i].st){ci=i;break;}}
    const cur=_tlSegs[ci];
    const ni=(ci+1)%_tlSegs.length;
    const nxt=_tlSegs[ni];
    const segEl=tL-cur.st; // 当前段已过秒数
    const segRm=cur.dur-segEl; // 当前段剩余秒数

    let blend=0; // 0=纯当前段, 1=纯下一段
    if(_tlSegs.length>1){
      if(segRm<_FADE) blend=((_FADE-segRm)/_FADE); // 结尾淡出
      if(segEl<_FADE&&ci>0) blend=0; // 段初已通过淡入（上一帧处理）
    }
    blend=Math.max(0,Math.min(1,blend));
    const sm=blend*blend*(3-2*blend); // smoothstep

    // 时序渲染：临时替换 params
    var _sp=params;
    if(blend<0.01){
      params=cur.p;
      var rn=RR[cur.mode]||RR[currentMode.id];
      if(rn)_renderLEDs(rn,wR,wG,wB,bR,bG,bB,isHM);
    } else {
      _renderBlend(
        RR[cur.mode]||RR[currentMode.id], cur.p,
        RR[nxt.mode]||RR[currentMode.id], nxt.p,
        sm, wR,wG,wB,bR,bG,bB,isHM
      );
    }
    params=_sp;
    if(isHM) Heatmap.drawLegend(ctx, W, H, 0, N, 0);
    ctx.restore();

    // 更新 tlBar
    const bar=document.getElementById('tlBar');
    if(bar){
      for(let i=0;i<bar.children.length;i++){
        bar.children[i].classList.toggle('tl-act',i===ci);
      }
    }
    // HUD
    const pct=Math.min(100,Math.round(segEl/cur.dur*100));
    document.getElementById('hud').innerHTML=
      '<span class="mn">'+cur.label+'</span>'+
      (isHM?' <span style="color:#ff6040;font-size:10px">[热力图]</span>':'')+' <br>'+
      '<span class="t">段 '+(ci+1)+'/'+_tlSegs.length+' · '+pct+'% · '+segEl.toFixed(1)+'s/'+cur.dur+'s</span>';
    document.getElementById('timeDisp').textContent=t.toFixed(2)+'/'+_tlDur.toFixed(0)+'s';
    document.getElementById('timeFill').style.width=(t/_tlDur*100)+'%';

  } else {
    // ── 普通模式 ──
    params=params; // 保持当前 params
    _renderLEDs(RR[currentMode.id],wR,wG,wB,bR,bG,bB,isHM);
    let sumB=0,maxB=0;
    for(let i=0;i<N;i++){const v=RR[currentMode.id](LEDS[i],t);sumB+=v;if(v>maxB)maxB=v;}
    if(isHM) Heatmap.drawLegend(ctx, W, H, sumB, N, maxB);
    document.getElementById('hud').innerHTML=
      '<span class="mn">'+currentMode.name+'</span>'+
      (isHM?' <span style="color:#ff6040;font-size:10px">[热力图]</span>':'')+' <br>'+
      '<span class="t">帧 '+Math.floor(t*FPS)+'/'+Math.floor(DURATION*FPS)+' · LED '+N+' · 均 '+(sumB/N).toFixed(3)+' · 峰 '+maxB.toFixed(3)+'</span>';
    document.getElementById('timeDisp').textContent=t.toFixed(2)+'/'+DURATION+'s';
    document.getElementById('timeFill').style.width=(t/DURATION*100)+'%';
  }
}

// ─── 渲染单模式 ─────────────────────────────────────
function _renderLEDs(rn,wR,wG,wB,bR,bG,bB,isHM){
  if(!rn)return;
  const glowArr=[];
  for(let i=0;i<N;i++){
    const l=LEDS[i],bv=rn(l,t);
    let r,g,b,sz;
    if(isHM){
      Heatmap.renderOne(ctx, l, bv, bR, bG, bB, scale);
      continue;
    } else {
      const e=bv*bv*(3-2*bv);r=bR+(wR-bR)*e;g=bG+(wG-bG)*e;b=bB+(wB-bB)*e;
      if(bv>.6){const gl=(bv-.6)*2.5;r=Math.min(255,r+gl*40);g=Math.min(255,g+gl*15);}
      sz=Math.max(1.2,1+l.rn*2.5);
    }
    if(l.circles&&l.circles.length>0){
      const batchLarge=[],batchMid=[],batchSmall=[];
      l.circles.forEach(c=>{if(c._cat===0)batchLarge.push(c);else if(c._cat===1)batchMid.push(c);else batchSmall.push(c);});
      [[batchLarge,0],[batchMid,1],[batchSmall,2]].forEach(([arr,idx])=>{
        if(arr.length===0)return;
        const _cr=[idx===0?[255,200,185]:idx===1?[240,70,25]:[140,10,8]][0];
        const _ce=bv*bv*(3-2*bv);
        const fr=((bR+(_cr[0]-bR)*_ce)|0),fg=((bG+(_cr[1]-bG)*_ce)|0),fb=((bB+(_cr[2]-bB)*_ce)|0);
        const glowMul=idx===2?4:6;
        // Draw glow
        arr.forEach(c=>{
          const r=Math.max(0.8,(c._r||.5)*scale*2);
          const grad=ctx.createRadialGradient(c.sx,c.sy,r*0.3,c.sx,c.sy,r*glowMul);
          grad.addColorStop(0,'rgba('+fr+','+fg+','+fb+','+(_ce*0.8)+')');
          grad.addColorStop(0.3,'rgba('+fr+','+fg+','+fb+','+(_ce*0.05)+')');
          grad.addColorStop(1,'rgba('+fr+','+fg+','+fb+',0)');
          ctx.fillStyle=grad;ctx.beginPath();ctx.arc(c.sx,c.sy,r*glowMul,0,Math.PI*2);ctx.fill();
        });
        // Draw solid circles
        ctx.fillStyle='rgb('+fr+','+fg+','+fb+')';
        ctx.beginPath();
        arr.forEach(c=>{ctx.moveTo(c.sx+Math.max(0.8,(c._r||.5)*scale*2),c.sy);ctx.arc(c.sx,c.sy,Math.max(0.8,(c._r||.5)*scale*2),0,Math.PI*2);});
        ctx.fill();
      });
    if(!isHM&&bv>.5)l.circles.forEach(c=>glowArr.push([c.sx,c.sy,wR,wG,wB,bv,Math.max(0.8,(c._r||.5)*scale*2)]))}else{
    ctx.beginPath();ctx.arc(l.sx,l.sy,sz,0,Math.PI*2);ctx.fill();
    if(!isHM&&bv>.5)glowArr.push([l.sx,l.sy,wR,wG,wB,bv,sz])}
  }
  for(const [sx,sy,wr,wg,wb,bv,sz] of glowArr){
    ctx.fillStyle='rgba('+wr+','+wg+','+wb+','+((bv-.5)*.03)+')';
    ctx.beginPath();ctx.arc(sx,sy,sz*1.5,0,Math.PI*2);ctx.fill();
  }
}

// ─── crossfade 混合渲染 ─────────────────────────────
function _renderBlend(rnA,psA,rnB,psB,sm,wR,wG,wB,bR,bG,bB,isHM){
  if(!rnA||!rnB)return;
  const _sp=params;
  for(let i=0;i<N;i++){
    const l=LEDS[i];
    params=psA; const bvA=rnA(l,t);

    params=_sp;
    const bv=bvA+(bvB-bvA)*sm;
    if(!isHM){
      const e=bv*bv*(3-2*bv);
      const r=bR+(wR-bR)*e,g=bG+(wG-bG)*e,b2=bB+(wB-bB)*e;
      const sz=Math.max(1.2,1+l.rn*2.5);
      if(l.circles&&l.circles.length>0){
        const batchLarge=[],batchMid=[],batchSmall=[];
        l.circles.forEach(c=>{if(c._cat===0)batchLarge.push(c);else if(c._cat===1)batchMid.push(c);else batchSmall.push(c);});
        [[batchLarge,0],[batchMid,1],[batchSmall,2]].forEach(([arr,idx])=>{
          if(arr.length===0)return;
          const _cr=[idx===0?[255,200,185]:idx===1?[240,70,25]:[140,10,8]][0];
          const _ce=bv*bv*(3-2*bv);
          const fr=((bR+(_cr[0]-bR)*_ce)|0),fg=((bG+(_cr[1]-bG)*_ce)|0),fb=((bB+(_cr[2]-bB)*_ce)|0);
          const glowMul=idx===2?4:6;
          // Draw glow
          arr.forEach(c=>{
            const r=Math.max(0.8,(c._r||.5)*scale*2);
            const grad=ctx.createRadialGradient(c.sx,c.sy,r*0.3,c.sx,c.sy,r*glowMul);
            grad.addColorStop(0,'rgba('+fr+','+fg+','+fb+','+(_ce*0.8)+')');
            grad.addColorStop(0.3,'rgba('+fr+','+fg+','+fb+','+(_ce*0.05)+')');
            grad.addColorStop(1,'rgba('+fr+','+fg+','+fb+',0)');
            ctx.fillStyle=grad;ctx.beginPath();ctx.arc(c.sx,c.sy,r*glowMul,0,Math.PI*2);ctx.fill();
          });
          // Draw solid circles
          ctx.fillStyle='rgb('+fr+','+fg+','+fb+')';
          ctx.beginPath();
          arr.forEach(c=>{ctx.moveTo(c.sx+Math.max(0.8,(c._r||.5)*scale*2),c.sy);ctx.arc(c.sx,c.sy,Math.max(0.8,(c._r||.5)*scale*2),0,Math.PI*2);});
          ctx.fill();
        });
      if(bv>.5){ctx.fillStyle='rgba('+wR+','+wG+','+wB+','+((bv-.5)*.03)+')';
      l.circles.forEach(c=>{ctx.beginPath();ctx.arc(c.sx,c.sy,Math.max(0.8,(c._r||.5)*scale*2)*3.5,0,Math.PI*2);ctx.fill()})}}else{
      ctx.beginPath();ctx.arc(l.sx,l.sy,sz,0,Math.PI*2);ctx.fill();
      if(bv>.5){ctx.fillStyle='rgba('+wR+','+wG+','+wB+','+((bv-.5)*.03)+')';
      ctx.beginPath();ctx.arc(l.sx,l.sy,sz*1.5,0,Math.PI*2);ctx.fill()}}
    } else {
      Heatmap.renderOne(ctx, l, bv, bR, bG, bB, scale);
    }
  }
  params=_sp;
}

function _nlParse(text){
  const d=text.toLowerCase();
  // 1. 找效果
  let bestId='sparkle',bestSc=0;
  _NLM.forEach(r=>r.k.forEach(k=>{if(d.includes(k)&&k.length>bestSc){bestSc=k.length;bestId=r.id;}}));
  const mo=MODES.find(m=>m.id===bestId);
  const p={}; mo.params.forEach(x=>{p[x.id]=x.val;});
  // 2. 特殊预设
  _NLS.forEach(s=>{if(s.m===bestId&&s.re.test(d)){Object.assign(p,s.p);}});
  // 3. 速度
  _NLV.speed.forEach(r=>{if(r.k.some(k=>d.includes(k))&&('speed' in p))p.speed=r.v;});
  // 4. 周期（呼吸）
  _NLV.period.forEach(r=>{if(r.k.some(k=>d.includes(k))&&('period' in p))p.period=r.v;});
  // 5. 数量
  _NLV.count.forEach(r=>{if(r.k.some(k=>d.includes(k))){if('count' in p)p.count=r.v;if('density' in p)p.density=Math.min(.5,r.v*.07+.05);}});
  // 6. 亮度
  _NLV.bright.forEach(r=>{if(r.k.some(k=>d.includes(k))){if('maxB' in p)p.maxB=r.v;if('bright' in p)p.bright=r.v;if('headBright' in p)p.headBright=r.v;}});
  // 7. 尾迹
  _NLV.tail.forEach(r=>{if(r.k.some(k=>d.includes(k))){const v=r.v==='long'?0.43:0.1;if('tailLen' in p)p.tailLen=v;if('tail' in p)p.tail=v;}});
  // 8. 密度特化
  if(/密集|繁密|满天|漫天/.test(d)&&'density' in p)p.density=0.5;
  if(/稀疏|零星|偶尔/.test(d)&&'density' in p)p.density=0.08;
  const names={meteor:'流星雨',singleMeteor:'单颗流星',wave:'波浪',breath:'呼吸',chase:'追逐',sparkle:'星空',centerSplit:'分流',marquee:'椭圆跑马灯',layerWave:'三层波浪',waveSplit:'波浪分流'};
  return{mode:bestId,params:p,summary:names[bestId],conf:Math.min(95,40+bestSc*5)};
}

  {re:/更暗|再暗|调暗|柔和/,fn:p=>{'maxB' in p&&(p.maxB=Math.max(p.maxB-.15,.3));'bright' in p&&(p.bright=Math.max(p.bright-.15,.3));return'已调暗';}},
  {re:/更多|再多|密.{0,2}点/,fn:p=>{'count' in p&&(p.count=Math.min(p.count+2,8));'density' in p&&(p.density=Math.min(p.density+.1,.5));return'已增多';}},
  {re:/更少|再少|稀.{0,2}点/,fn:p=>{'count' in p&&(p.count=Math.max(p.count-1,1));'density' in p&&(p.density=Math.max(p.density-.1,.05));return'已减少';}},
  {re:/尾.{0,3}长|长尾/,fn:p=>{'tailLen' in p&&(p.tailLen=Math.min(p.tailLen+.1,.6));'tail' in p&&(p.tail=Math.min(p.tail+.08,.5));return'尾迹加长';}},
  {re:/尾.{0,3}短|短尾/,fn:p=>{'tailLen' in p&&(p.tailLen=Math.max(p.tailLen-.1,.05));'tail' in p&&(p.tail=Math.max(p.tail-.05,.04));return'尾迹缩短';}},
  {re:/蓝/,fn:()=>{const e=document.getElementById('colorWave');e&&(e.value='#2060ff');return'主色→蓝';}},
  {re:/红/,fn:()=>{const e=document.getElementById('colorWave');e&&(e.value='#ff1818');return'主色→红';}},

  {re:/白/,fn:()=>{const e=document.getElementById('colorWave');e&&(e.value='#e0e8ff');return'主色→白';}},
  {re:/青|水蓝/,fn:()=>{const e=document.getElementById('colorWave');e&&(e.value='#00d4ff');return'主色→青';}},
];
function _isMicro(t){return _MC.some(r=>r.re.test(t))||/^(再|更|调|改|换|加|减|快|慢|亮|暗|多|少|长|短|颜色)/.test(t);}
function _doMicro(text){
  if(!_memMode)return false;
  const mo=MODES.find(x=>x.id===_memMode);if(!mo)return false;
  const p={};mo.params.forEach(x=>{p[x.id]=x.val;});
  for(const r of _MC){
    if(r.re.test(text)){
      const msg=r.fn(p);
      mo.params.forEach(x=>{if(x.id in p)x.val=p[x.id];});
      currentMode=mo;_snap();buildUI();_startPlay();
      _showNLResult('<span style="font-size:13px;font-weight:700;color:#e0d0c0">'+msg+'</span> <span style="font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid #8ab444;color:#8ab4ff;background:#8ab411">△微调</span>');
      showToast('△ '+msg);return true;
    }
  }
  return false;
}

async function doNL(text){
  if(!text||!text.trim())return;
  _showNLResult('<span style="color:#446;font-size:11px;display:flex;align-items:center;gap:5px"><span id="_nlSpin" style="display:inline-block;animation:_nlSp 1s linear infinite">◌</span> 解析中…</span>');
  if(_isMicro(text)&&_doMicro(text))return;
  let res=null,src='rule';
  const ol=await _olQuery(text);
  if(ol){res=ol;src='ollama';}else{res=_nlParse(text);src='rule';}
  const mo=MODES.find(x=>x.id===res.mode);if(!mo)return;
  mo.params.forEach(p=>{if(res.params&&res.params[p.id]!==undefined)p.val=res.params[p.id];});
  currentMode=mo;_snap();buildUI();_startPlay();
  const conf=res.conf||(src==='ollama'?85:62);
  const cc=conf>=75?'#6d8':conf>=50?'#fa0':'#f86';
  const bd=src==='ollama'?'<span style="font-size:9px;padding:2px 6px;border-radius:8px;border:1px solid #6d833;color:#6d8;background:#6d811">● Ollama</span>':'<span style="font-size:9px;padding:2px 6px;border-radius:8px;border:1px solid #fa033;color:#fa0;background:#fa011">◎ 规则</span>';
  const ps=Object.entries(res.params||{}).filter(([,v])=>typeof v==='number').map(([k,v])=>'<span style="color:#667">'+k+'</span>=<span style="color:#ff8060">'+(Number.isInteger(v)?v:v.toFixed(2))+'</span>').join(' ');
  _showNLResult('<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap"><span style="font-size:13px;font-weight:700;color:#e0d0c0">'+(res.summary||res.mode)+'</span>'+bd+'<span style="font-size:9px;padding:2px 6px;border-radius:8px;border:1px solid '+cc+'33;color:'+cc+';background:'+cc+'11">'+conf+'%</span></div><div style="font-size:10px;line-height:1.9;font-family:monospace;color:#445;word-break:break-all">'+(ps||'默认参数')+'</div>');
  showToast('✦ '+(res.summary||res.mode)+' 已生成');
}

// ─── 时序解析 + 控制 ────────────────────────────────
function _parseTL(text){
  var segs=[];
  // 统一分隔符
  var norm=text.replace(/[→\->]+/g,',').replace(/[,，、；;]+/g,',');
  var parts=norm.split(',').map(function(s){return s.trim()}).filter(Boolean);
  if(!parts.length)return{segs:[],dur:0};
  
  for(var pi=0;pi<parts.length;pi++){
    var part=parts[pi];
    // 提取时间：必须有 "秒" 或 "s"
    var dm=part.match(/(\d+(?:\.\d+)?)\s*[秒s]/i);
    var dur=dm?Math.max(0.5,parseFloat(dm[1])):4;
    // 移除时间部分得到描述
    var desc=part.replace(/(\d+(?:\.\d+)?)\s*[秒sS]?\s*/g,'').trim();
    if(!desc)continue;
    
    // 调用 _nlParse
    var r=_nlParse(desc);
    if(!r||!r.mode)continue;
    
    // 补全参数
    var mo=null;
    for(var mi=0;mi<MODES.length;mi++){if(MODES[mi].id===r.mode){mo=MODES[mi];break;}}
    var fp={};
    if(mo&&mo.params){for(var k=0;k<mo.params.length;k++){fp[mo.params[k].id]=mo.params[k].val;}}
    for(var pk in r.params){if(r.params.hasOwnProperty(pk))fp[pk]=r.params[pk];}
    
    segs.push({mode:r.mode,p:fp,dur:dur,label:r.summary||desc,st:0});
  }
  if(!segs.length)return{segs:[],dur:0};
  var acc=0;
  for(var si=0;si<segs.length;si++){segs[si].st=acc;acc+=segs[si].dur;}
  return{segs:segs,dur:acc};
}

window.startTL=function(){
  var inp=document.getElementById('tlInput');
  var text=inp?(inp.value||''):'';
  if(!text.trim()){showToast('请先输入时序描述');return;}
  var r=_parseTL(text);
  if(!r.segs.length){showToast('未解析到时序，格式：效果3秒，效果5秒');return;}
  
  _tlSegs=r.segs;_tlDur=r.dur;_tlOn=true;
  _tlLoop=true;
  var cb=document.getElementById('tlLoop');
  if(cb)_tlLoop=cb.checked;
  t=0;
  
  // 更新进度条
  var bar=document.getElementById('tlBar');
  if(bar){
    bar.innerHTML='';
    for(var i=0;i<r.segs.length;i++){
      var s=r.segs[i];
      var d=document.createElement('div');
      d.className='tl-seg';
      d.style.flex=String(s.dur);
      d.title='段'+(i+1)+': '+s.label+' · '+s.dur+'秒';
      d.textContent=s.label.slice(0,5);
      bar.appendChild(d);
    }
  }
  
  // 更新状态
  var st=document.getElementById('tlStatus');
  if(st)st.textContent='运行 · '+r.segs.length+'段 · '+r.dur+'秒';
  
  // 确保动画在播放
  playing=true;
  frameRunning=true;
  rafId=requestAnimationFrame(_frame);
  var bp=document.getElementById('btnPlay');
  if(bp){bp.textContent='⏸';bp.className='play-btn primary';}
  
  showToast('⏱ 时序启动 · '+r.segs.length+'段 '+r.dur+'秒');
};;

      </div>
      <div class="chips">
        <span class="lchip" onclick="_lnlQ('缓慢呼吸')">🫁 缓慢呼吸</span>
        <span class="lchip" onclick="_lnlQ('快速流星')">🚀 快速流星</span>
        <span class="lchip" onclick="_lnlQ('蓝色分流')">🔀 蓝色分流</span>
        <span class="lchip" onclick="_lnlQ('温柔波浪')">🌊 温柔波浪</span>
        <span class="lchip" onclick="_lnlQ('激烈追逐')">🔄 激烈追逐</span>
        <span class="lchip" onclick="_lnlQ('繁星闪烁')">✨ 繁星闪烁</span>
      </div>`;
    lc.insertBefore(wrap,eg);
    document.getElementById('_lnlInp').addEventListener('keydown',e=>{if(e.key==='Enter')_lnlGo();});
  }

  window._lnlGo=function(){const t=(document.getElementById('_lnlInp')||{}).value||'';if(!t.trim()){showToast('请输入描述');return;}_lnlQ(t);};
  window._lnlQ=function(text){
    const inp=document.getElementById('_lnlInp');if(inp)inp.value=text;
    // 解析并进入对应效果
    const r=_nlParse(text);
    const eff=EFFECTS.find(e=>e.mode===r.mode)||EFFECTS[0];
    // 应用 NL 参数
    const mo=MODES.find(m=>m.id===r.mode);
    if(mo)mo.params.forEach(p=>{if(r.params&&r.params[p.id]!==undefined)p.val=r.params[p.id];});
    // 设置颜色（如果提到颜色关键词）
    if(/蓝/.test(text)){const e=document.getElementById('colorWave');e&&(e.value='#2060ff');}
    else if(/红/.test(text)){const e=document.getElementById('colorWave');e&&(e.value='#ff1818');}
    else if(/绿/.test(text)){const e=document.getElementById('colorWave');e&&(e.value='#00e860');}
    else if(/紫/.test(text)){const e=document.getElementById('colorWave');e&&(e.value='#a020ff');}
    // 进入预览
    document.querySelectorAll('.effect-card').forEach(c=>c.classList.remove('selected'));
    document.getElementById('landing').classList.add('hide');
    setTimeout(()=>{
      document.getElementById('landing').style.display='none';
      document.getElementById('preview').classList.add('show');
      currentMode=MODES.find(m=>m.id===r.mode)||MODES[0];
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        resize();buildUI();t2=0;playing=true;
        if(!frameRunning){frameRunning=true;rafId=requestAnimationFrame(_frame);}
        showToast('✦ '+(r.summary||r.mode)+' 已生成');
      }));
    },700);
  };

  // 缩略图
  const TW=140,TH=44,tsc=Math.min(TW/(A*2.1),TH/(B*2.1));
  const tLEDs=LEDS.map(l=>({id:l.id,rn:l.rn,sx:TW/2+l.x*tsc,sy:TH/2-l.y*tsc}));
  const sts=[];
  function buildThumbs(){
    document.querySelectorAll('#effectGrid .effect-card').forEach((card,idx)=>{
      if(card.dataset.td)return; card.dataset.td='1';
      const eff=EFFECTS[idx];if(!eff)return;
      const mo=MODES.find(m=>m.id===eff.mode);const rn=RR[eff.mode];if(!mo||!rn)return;
      const iconEl=card.querySelector('.icon');if(!iconEl)return;
      const cv2=document.createElement('canvas');cv2.width=TW;cv2.height=TH;
      cv2.style.cssText='border-radius:5px;margin:0 auto 8px;display:block;max-width:100%;background:#06060e;box-shadow:0 0 8px rgba(0,0,0,.55);pointer-events:none';
      iconEl.replaceWith(cv2);
      const lp={};mo.params.forEach(p=>{lp[p.id]=eff.p[p.id]??p.val;});
      sts.push({ctx2:cv2.getContext('2d'),rn,lp,t2:Math.random()*8,cv2});
      card.addEventListener('mouseenter',()=>{cv2.style.boxShadow='0 0 18px rgba(255,60,40,.35)';});
      card.addEventListener('mouseleave',()=>{cv2.style.boxShadow='0 0 8px rgba(0,0,0,.55)';});
    });
  }
  let lastTT=0;
  function tick(now){
    requestAnimationFrame(tick);
    if(now-lastTT<52)return;lastTT=now;
    const land=document.getElementById('landing');
    if(!land||land.style.display==='none'||land.classList.contains('hide'))return;
    const [wR,wG,wB]=hexRGB('#ff1818'),[bR,bG,bB]=hexRGB('#120000');
    sts.forEach(s=>{
      s.t2+=1/19;
      const _sp=params;params=s.lp;
      s.ctx2.fillStyle='#04040c';s.ctx2.fillRect(0,0,TW,TH);
      for(let i=0;i<N;i++){
        const l=tLEDs[i],bv=s.rn(LEDS[i],s.t2);if(bv<0.03)continue;
        const e=bv*bv*(3-2*bv);
        s.ctx2.fillStyle='rgb('+((bR+(wR-bR)*e)|0)+','+((bG+(wG-bG)*e)|0)+','+((bB+(wB-bB)*e)|0)+')';
        s.ctx2.beginPath();s.ctx2.arc(l.sx,l.sy,Math.max(.6,.35+l.rn*.85),0,Math.PI*2);s.ctx2.fill();
      }
      params=_sp;
    });
  }
  setTimeout(()=>{buildThumbs();requestAnimationFrame(tick);},160);
})();

// ─── enterEffect hook ─────────────────────────────
(function(){
  const _o=enterEffect;
  enterEffect=function(eff){
    _o(eff);
    setTimeout(_ensurePanels,900);
  };
})();


/* ═══ 缩放和平移 ═══ */
const canvasEl=document.getElementById('cv');
canvasEl.addEventListener('wheel',function(e){
  e.preventDefault();
  const factor=e.deltaY>0?0.9:1.1;
  zoomLevel=Math.max(0.5,Math.min(10,zoomLevel*factor));
  document.getElementById('hud').innerHTML='<span class="mn">'+currentMode.name+'</span><br><span class="t">缩放: '+zoomLevel.toFixed(1)+'x</span>';
},{passive:false});

canvasEl.addEventListener('mousedown',function(e){
  if(e.button===0){isPanning=true;panStartX=e.clientX-panX;panStartY=e.clientY-panY;canvasEl.style.cursor='grabbing'}
});
document.addEventListener('mousemove',function(e){
  if(isPanning){panX=e.clientX-panStartX;panY=e.clientY-panStartY}
});
document.addEventListener('mouseup',function(){isPanning=false;canvasEl.style.cursor='grab'});
canvasEl.style.cursor='grab';

/* Reset zoom on double-click */
canvasEl.addEventListener('dblclick',function(){zoomLevel=1;panX=0;panY=0});
</script>
