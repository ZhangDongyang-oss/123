{% extends "base.html" %}
{% set active = 'reminders' %}
{% block title %}问题提醒 · FC 可行性分析（灯光）{% endblock %}

{% block content %}
<section class="hero" style="padding-bottom:16px;margin-bottom:12px">
  <span class="text-eyebrow">Reminders</span>
  <h2>问题提醒与跟踪</h2>
  <p class="hero-sub">设置提醒，跟踪 FC 问题处理进度。</p>
</section>

<!-- 添加提醒 -->
<div class="card" style="margin-bottom:16px">
  <div class="card-body">
    <h3 style="font-size:15px;font-weight:600;margin-bottom:12px">添加提醒</h3>
    <form hx-post="/api/reminders" hx-target="#reminder-list" hx-swap="afterbegin" hx-on::after-request="this.reset()">
      <div class="form-row--grid">
        <div class="form-group">
          <label class="form-label" for="fc_key">FC 编号</label>
          <input type="text" class="form-input" id="fc_key" name="fc_key" placeholder="FC-XXXX-XXXX" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="remind_at">提醒时间</label>
          <input type="datetime-local" class="form-input" id="remind_at" name="remind_at" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="note">备注</label>
          <input type="text" class="form-input" id="note" name="note" placeholder="例如：跟进修复方案">
        </div>
        <button type="submit" class="btn-primary btn-sm" style="height:38px;align-self:end">
          <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          添加提醒
        </button>
      </div>
    </form>
  </div>
</div>

<!-- 提醒列表 -->
<div class="card">
  <div class="card-header">
    <h3>提醒列表</h3>
  </div>
  <div class="card-body" style="padding:0">
    <div id="reminder-list" hx-get="/api/reminders/list" hx-trigger="load" hx-swap="innerHTML">
      <div style="padding:32px;text-align:center">
        <p class="muted">加载中…</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
