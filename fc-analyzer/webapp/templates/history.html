{% extends "base.html" %}
{% set active = 'history' %}
{% block title %}工作台 · FC 可行性分析（灯光）{% endblock %}

{% block content %}
<section class="hero" style="padding-bottom:16px;margin-bottom:12px">
  <span class="text-eyebrow">Workbench</span>
  <h2>FC 工作台</h2>
  <p class="hero-sub">管理你的 FC 工单、分析记录和草稿。</p>
</section>

<!-- 统计卡片 -->
<div class="stat-grid" id="stat-grid" style="margin-bottom:12px">
  <div class="stat-card">
    <div style="font-size:28px;font-weight:700;font-family:ui-monospace,monospace;color:var(--system-blue)" id="stat-total">-</div>
    <div class="muted" style="font-size:12px;margin-top:6px">总计</div>
  </div>
  <div class="stat-card">
    <div style="font-size:28px;font-weight:700;font-family:ui-monospace,monospace;color:var(--system-orange)" id="stat-draft">-</div>
    <div class="muted" style="font-size:12px;margin-top:6px">草稿</div>
  </div>
  <div class="stat-card">
    <div style="font-size:28px;font-weight:700;font-family:ui-monospace,monospace;color:var(--system-green)" id="stat-submitted">-</div>
    <div class="muted" style="font-size:12px;margin-top:6px">已提交</div>
  </div>
  <div class="stat-card">
    <div style="font-size:28px;font-weight:700;font-family:ui-monospace,monospace;color:var(--system-purple)" id="stat-closed">-</div>
    <div class="muted" style="font-size:12px;margin-top:6px">已关闭</div>
  </div>
</div>

<!-- 报告状态检查（按模板） -->
<div class="card" style="margin-bottom:12px" id="report-check-card">
  <div class="card-body" style="padding:16px 20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <h3 style="font-size:15px;margin:0;font-weight:700">报告状态检查</h3>
      <span class="muted" id="rc-meta" style="font-size:12px"></span>
      <span style="flex:1"></span>
      <select class="form-input" id="rc-filter" onchange="loadReportCheck()" style="min-width:140px">
        <option value="mine" selected>只看我负责的</option>
        <option value="all">全部工单</option>
        <option value="overdue">只看超期未闭</option>
      </select>
      <button type="button" class="btn-ghost btn-sm" onclick="loadReportCheck()">刷新</button>
    </div>
    <div id="rc-summary" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:14px"></div>
    <div id="rc-issues" style="overflow-x:auto"></div>
  </div>
</div>

<!-- 搜索/筛选 -->
<div class="card" style="margin-bottom:12px">
  <div class="card-body" style="padding:16px 20px">
    <div class="toolbar">
      <div class="grow">
        <input type="text" class="form-input" id="history-search" placeholder="搜索 FC 编号或问题描述…" oninput="filterHistory()" style="width:100%">
      </div>
      <select class="form-input" id="history-status-filter" onchange="filterHistory()" style="min-width:130px">
        <option value="">全部状态</option>
        <option value="草稿">草稿</option>
        <option value="已提交">已提交</option>
        <option value="已关闭">已关闭</option>
      </select>
      <a href="/new" class="btn-primary btn-sm">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建
      </a>
    </div>
  </div>
</div>

<!-- 列表 -->
<div class="card" style="overflow:hidden">
  <div class="card-body" style="padding:0">
    <div id="history-table" hx-get="/api/history/list" hx-trigger="load" hx-swap="innerHTML">
      <div style="padding:32px;text-align:center">
        <p class="muted">加载中…</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function loadMoreHistory(btn) {
  var page = btn.getAttribute('data-page');
  btn.disabled = true;
  fetch('/api/history/list?page=' + page)
    .then(function(r) { return r.text(); })
    .then(function(html) {
      var host = btn.closest('tr');
      host.insertAdjacentHTML('beforebegin', html);
      host.remove();
      filterHistory();
    })
    .catch(function() { btn.disabled = false; alert('网络错误'); });
}

function delDraft(key, btn) {
  if (!confirm('确认删除草稿 ' + key + ' ？删除后不可恢复。')) return;
  fetch('/api/history/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: key })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) {
      var tr = btn.closest('tr');
      if (tr) tr.remove();
      filterHistory();
    } else {
      alert('删除失败：' + (d.error || '未知错误'));
    }
  }).catch(function() { alert('网络错误'); });
}

function filterHistory() {
  var q = document.getElementById('history-search').value.toLowerCase();
  var status = document.getElementById('history-status-filter').value;
  var rows = document.querySelectorAll('#history-table tr[data-key]');
  var counts = {total: 0, draft: 0, submitted: 0, closed: 0};
  rows.forEach(function(row) {
    var text = row.textContent.toLowerCase();
    var rowStatus = row.dataset.status || '';
    var matchQ = !q || text.indexOf(q) >= 0;
    var matchS = !status || rowStatus === status;
    var show = matchQ && matchS;
    row.style.display = show ? '' : 'none';
    if (show) {
      counts.total++;
      if (rowStatus === '草稿') counts.draft++;
      else if (rowStatus === '已提交') counts.submitted++;
      else if (rowStatus === '已关闭') counts.closed++;
    }
  });
  document.getElementById('stat-total').textContent = counts.total;
  document.getElementById('stat-draft').textContent = counts.draft;
  document.getElementById('stat-submitted').textContent = counts.submitted;
  document.getElementById('stat-closed').textContent = counts.closed;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function loadReportCheck() {
  var issuesBox = document.getElementById('rc-issues');
  var filter = document.getElementById('rc-filter').value;
  if (issuesBox) issuesBox.innerHTML = '<p class="muted">加载中…</p>';
  fetch('/api/report-check?filter=' + encodeURIComponent(filter))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      document.getElementById('rc-meta').textContent =
        '模板：' + d.template.name + ' · 数据源：' + (d.source === 'viim' ? 'VIIM 实时' : (d.source === 'local' ? '本地' : '无数据'));
      var statusPills = Object.keys(d.status_counts || {}).map(function(k) {
        return '<span class="pill" style="margin:0">' + escapeHtml(k) + ' ' + d.status_counts[k] + '</span>';
      }).join('');
      document.getElementById('rc-summary').innerHTML =
        '<div><b style="font-size:24px;font-family:ui-monospace,monospace">' + d.total + '</b><div class="muted" style="font-size:12px">总计</div></div>' +
        '<div><b style="font-size:24px;font-family:ui-monospace,monospace;color:var(--system-green)">' + d.complete + '</b><div class="muted" style="font-size:12px">完整</div></div>' +
        '<div><b style="font-size:24px;font-family:ui-monospace,monospace;color:var(--system-red)">' + d.incomplete + '</b><div class="muted" style="font-size:12px">缺项</div></div>' +
        '<span style="flex:1"></span>' + statusPills;

      var issues = d.issues || [];
      if (!issues.length) {
        issuesBox.innerHTML = '<p class="muted" style="margin:0">无匹配工单。</p>';
        return;
      }
      var rows = issues.slice(0, 50).map(function(i) {
        var keyLink = i.url
          ? '<a href="' + escapeHtml(i.url) + '" target="_blank" style="font-family:ui-monospace,monospace;color:var(--system-blue)">' + escapeHtml(i.key) + '</a>'
          : '<span style="font-family:ui-monospace,monospace">' + escapeHtml(i.key) + '</span>';
        var missText = i.missing_count > 0
          ? '<span style="color:var(--system-red);font-size:12px">' + escapeHtml(i.missing.join('、')) + '</span>'
          : '<span style="color:var(--system-green)">✅</span>';
        var days = (i.days_open == null) ? '-' : (i.days_open + ' 天');
        return '<tr><td>' + keyLink + '</td>' +
          '<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(i.summary) + '</td>' +
          '<td><span class="badge">' + escapeHtml(i.status) + '</span></td>' +
          '<td style="font-family:ui-monospace,monospace">' + days + '</td>' +
          '<td style="font-family:ui-monospace,monospace">' + Math.round(i.completeness * 100) + '%</td>' +
          '<td>' + missText + '</td></tr>';
      }).join('');
      issuesBox.innerHTML =
        '<table class="history-table"><thead><tr><th>FC Key</th><th>问题</th><th>状态</th><th>打开天数</th><th>完整度</th><th>缺项</th></tr></thead><tbody>' +
        rows + '</tbody></table>';
    })
    .catch(function() { issuesBox.innerHTML = '<p class="muted">加载失败，请确认 VIIM Token 有效。</p>'; });
}

document.addEventListener('DOMContentLoaded', function() {
  setTimeout(filterHistory, 500);
  loadReportCheck();
});
</script>
{% endblock %}
