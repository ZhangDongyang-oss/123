<div class="list-item" id="reminder-{{ r.id }}" style="padding:14px 18px;{% if r.status == 'done' %}opacity:0.5{% endif %}">
  <div class="list-item__icon" style="background:{% if r.status == 'done' %}var(--system-green-muted, rgba(52,199,89,0.10)){% else %}var(--system-blue-tint, rgba(0,113,227,0.10)){% endif %}">
    {% if r.status == 'done' %}
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--system-green)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    {% else %}
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--system-blue)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    {% endif %}
  </div>
  <div class="list-item__text" style="flex:1">
    <div class="list-item__primary">
      <span style="font-weight:600;font-family:ui-monospace,monospace">{{ r.fc_key }}</span>
      {% if r.note %}<span class="muted" style="margin-left:8px;font-size:13px">{{ r.note }}</span>{% endif %}
    </div>
    <div class="list-item__secondary">
      提醒时间：{{ r.remind_at or '未设置' }} · 创建于 {{ r.created_at[:10] if r.created_at else '—' }}
    </div>
  </div>
  <div style="display:flex;gap:6px">
    {% if r.status != 'done' %}
    <button class="btn-ghost btn-sm" onclick="markDone('{{ r.id }}')" title="标记完成">✓ 完成</button>
    {% endif %}
    <button class="btn-ghost btn-sm" onclick="deleteReminder('{{ r.id }}')" title="删除" style="color:var(--system-red)">删除</button>
  </div>
</div>

<script>
function markDone(id) {
  fetch('/api/reminders/' + id + '/done', {method: 'POST'})
    .then(function() {
      var el = document.getElementById('reminder-' + id);
      if (el) { el.style.opacity = '0.5'; el.querySelector('.btn-ghost').remove(); }
    });
}
function deleteReminder(id) {
  if (!confirm('确认删除此提醒？')) return;
  fetch('/api/reminders/' + id + '/delete', {method: 'POST'})
    .then(function() {
      var el = document.getElementById('reminder-' + id);
      if (el) el.remove();
    });
}
</script>
